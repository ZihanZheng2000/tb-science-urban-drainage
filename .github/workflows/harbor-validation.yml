name: Harbor validation

on:
  push:
    paths:
      - "tasks/**"
      - "scripts/**"
      - "requirements-validation.txt"
      - ".github/workflows/harbor-validation.yml"
  pull_request:
    paths:
      - "tasks/**"
      - "scripts/**"
      - "requirements-validation.txt"
      - ".github/workflows/harbor-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.agent }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        agent: [oracle, nop]
    env:
      HARBOR_TELEMETRY: "0"
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - name: Check out task source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Harbor
        run: python -m pip install -r requirements-validation.txt
      - name: Test trial evidence checks
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build images and run Harbor
        run: bash scripts/validate_harbor.sh "${{ matrix.agent }}"
      - name: Preserve build, trial, reward, and CTRF evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harbor-${{ matrix.agent }}
          path: validation/${{ matrix.agent }}/
          if-no-files-found: error
          retention-days: 14
